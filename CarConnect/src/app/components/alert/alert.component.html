<!-- Toast Notifications -->
<div class="alert-container">
  <div *ngFor="let alert of alerts()" 
       class="alert-toast" 
       [ngClass]="alert.type"
       role="alert">
    <div class="alert-icon">
      <i class="fa" [ngClass]="getIcon(alert.type)"></i>
    </div>
    <div class="alert-message">
      {{ alert.message }}
    </div>
    <button class="alert-close" (click)="removeAlert(alert.id)" aria-label="Close">
      &times;
    </button>
  </div>
</div>

<!-- Confirmation Modal -->
<div class="confirm-overlay" *ngIf="confirmOptions()" (click)="onConfirm(false)">
  <div class="confirm-modal" (click)="$event.stopPropagation()">
    <div class="confirm-header">
      <h3>{{ confirmOptions()?.title }}</h3>
      <button class="close-btn" (click)="onConfirm(false)">&times;</button>
    </div>
    <div class="confirm-body">
      <p>{{ confirmOptions()?.message }}</p>
    </div>
    <div class="confirm-footer">
      <button class="btn-cancel" (click)="onConfirm(false)">{{ confirmOptions()?.cancelText }}</button>
      <button class="btn-confirm" (click)="onConfirm(true)">{{ confirmOptions()?.confirmText }}</button>
    </div>
  </div>
</div>
